[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "black>=26.10.0",
    "fastapi>=0.142.2",
    "greenlet>=3.5.6",
    "jinja2>=3.1.6",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.10.1",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
    "openai>=3.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
